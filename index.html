<h1>BMI Calculator</h1>

Weight (kg):
<input id="w" type="number"><br><br>

Height (cm):
<input id="h" type="number"><br><br>

<button onclick="bmi()">Calculate BMI</button>

<h2 id="r"></h2>

<script>
function bmi(){
let w=document.getElementById("w").value;
let h=document.getElementById("h").value/100;
let b=(w/(h*h)).toFixed(1);
document.getElementById("r").innerHTML="Your BMI is "+b;
}
</script>
