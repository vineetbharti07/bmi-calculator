<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vineet's BMI Wellness</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    text-align: center;
    min-height: 100vh;
    padding: 30px 15px;
    background: linear-gradient(135deg, #667eea, #764ba2, #6dd5ed);
    background-size: 300% 300%;
    animation: gradient 10s ease infinite;
}

@keyframes gradient {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.box {
    max-width: 430px;
    margin: auto;
    padding: 25px;
    border-radius: 25px;
    background: rgba(255,255,255,0.18);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);
    box-shadow: 0 10px 35px rgba(0,0,0,0.25);
    color: white;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    opacity: 0.9;
    margin-bottom: 25px;
}

label {
    display: block;
    text-align: left;
    margin-top: 15px;
    font-weight: bold;
}

input {
    width: 100%;
    padding: 13px;
    margin-top: 7px;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    outline: none;
}

button {
    width: 100%;
    padding: 14px;
    margin-top: 20px;
    border: none;
    border-radius: 12px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.calculate {
    background: white;
    color: #6246a8;
}

.reset {
    background: rgba(255,255,255,0.25);
    color: white;
}

button:active {
    transform: scale(0.97);
}

#result {
    margin-top: 20px;
    font-size: 20px;
    font-weight: bold;
}

.sticker {
    font-size: 60px;
    margin-top: 10px;
}

.todo {
    margin-top: 25px;
    padding: 18px;
    background: rgba(255,255,255,0.15);
    border-radius: 18px;
    text-align: left;
}

.todo h2 {
    text-align: center;
}

.todo label {
    font-weight: normal;
    margin: 12px 0;
}

.todo input {
    width: auto;
    margin-right: 8px;
}

.note {
    font-size: 13px;
    margin-top: 20px;
    opacity: 0.85;
}
</style>
</head>

<body>

<div class="box">

<h1>⚖️ Vineet's BMI Wellness</h1>

<p class="subtitle">
Healthy habits • Daily routine • Stay active 🌱
</p>

<label>Weight (kg)</label>
<input id="weight" type="number" placeholder="Enter your weight">

<label>Height (cm)</label>
<input id="height" type="number" placeholder="Enter your height">

<button class="calculate" onclick="calculateBMI()">
🧮 Calculate BMI
</button>

<button class="reset" onclick="resetBMI()">
🔄 Reset
</button>

<div id="result"></div>
<div id="sticker"></div>
<div id="todo"></div>

<p class="note">
BMI is only a general screening measure. For teenagers,
BMI should be interpreted using age- and sex-specific growth charts.
</p>

</div>

<script>

function calculateBMI() {

    let weight = parseFloat(document.getElementById("weight").value);
    let height = parseFloat(document.getElementById("height").value);

    if (!weight || !height || weight <= 0 || height <= 0) {
        document.getElementById("result").innerHTML =
        "⚠️ Please enter valid weight and height.";
        document.getElementById("sticker").innerHTML = "🙂";
        document.getElementById("todo").innerHTML = "";
        return;
    }

    let heightMeter = height / 100;
    let bmi = weight / (heightMeter * heightMeter);
    bmi = bmi.toFixed(1);

    document.getElementById("result").innerHTML =
    "Your BMI: " + bmi;

    if (bmi < 18.5) {

        document.getElementById("sticker").innerHTML = "🌱😊";

        document.getElementById("todo").innerHTML = `
        <div class="todo">
        <h2>🥗 Your Wellness To-Do List</h2>

        <label>
        <input type="checkbox">
        🌅 7:00 AM — Have a balanced breakfast
        </label>

        <label>
        <input type="checkbox">
        🍎 10:30 AM — Have a nutritious snack
        </label>

        <label>
        <input type="checkbox">
        🍛 1:30 PM — Have a balanced lunch
        </label>

        <label>
        <input type="checkbox">
        🚶 5:00 PM — Outdoor play or enjoyable activity
        </label>

        <label>
        <input type="checkbox">
        🍽️ 8:30 PM — Have a balanced dinner
        </label>

        <label>
        <input type="checkbox">
        😴 9:30 PM — Relax and prepare for sleep
        </label>
        </div>
        `;

    } else if (bmi >= 18.5 && bmi < 25) {

        document.getElementById("sticker").innerHTML = "🎉😄⭐";

        document.getElementById("todo").innerHTML = `
        <div class="todo">
        <h2>🌟 Great! Keep Your Healthy Routine</h2>

        <label>
        <input type="checkbox">
        🌅 7:00 AM — Balanced breakfast
        </label>

        <label>
        <input type="checkbox">
        💧 10:30 AM — Drink water
        </label>

        <label>
        <input type="checkbox">
        🍛 1:30 PM — Balanced lunch
        </label>

        <label>
        <input type="checkbox">
        🏃 5:00 PM — Play or enjoy physical activity
        </label>

        <label>
        <input type="checkbox">
        🥗 8:30 PM — Balanced dinner
        </label>

        <label>
        <input type="checkbox">
        😴 9:30 PM — Regular sleep routine
        </label>
        </div>
        `;

    } else {

        document.getElementById("sticker").innerHTML = "🌿💪🙂";

        document.getElementById("todo").innerHTML = `
        <div class="todo">
        <h2>💪 Healthy Habit To-Do List</h2>

        <label>
        <input type="checkbox">
        🌅 7:00 AM — Have a balanced breakfast
        </label>

        <label>
        <input type="checkbox">
        🍎 10:30 AM — Choose a nutritious snack
        </label>

        <label>
        <input type="checkbox">
        🥗 1:30 PM — Balanced lunch with vegetables
        </label>

        <label>
        <input type="checkbox">
        🏃 5:00 PM — Enjoy outdoor play or activity
        </label>

        <label>
        <input type="checkbox">
        🍽️ 8:30 PM — Balanced dinner
        </label>

        <label>
        <input type="checkbox">
        😴 9:30 PM — Relax and maintain a regular sleep routine
        </label>
        </div>
        `;
    }
}

function resetBMI() {

    document.getElementById("weight").value = "";
    document.getElementById("height").value = "";

    document.getElementById("result").innerHTML = "";
    document.getElementById("sticker").innerHTML = "";
    document.getElementById("todo").innerHTML = "";
}

</script>

</body>
    </html>
