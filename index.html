<!DOCTYPE html>
<html>
<head>
    <title>Vineet's BMI Calculator</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            min-height: 100vh;
            padding-top: 40px;
        }

        .box {
            width: 85%;
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 30px 20px;
            border-radius: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.25);
        }

        h1 {
            color: #2457a6;
            margin-bottom: 5px;
        }

        .creator {
            color: #777;
            font-size: 17px;
            margin-bottom: 25px;
        }

        input {
            width: 85%;
            padding: 14px;
            margin: 8px;
            border: 2px solid #74a9ff;
            border-radius: 12px;
            font-size: 16px;
        }

        button {
            margin-top: 15px;
            padding: 14px 25px;
            border: none;
            border-radius: 12px;
            background: #2457a6;
            color: white;
            font-size: 17px;
        }

        button:active {
            transform: scale(0.95);
        }

        #sticker {
            font-size: 65px;
            margin-top: 20px;
        }

        #result {
            font-size: 20px;
            font-weight: bold;
            margin-top: 10px;
        }

        .footer {
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>⚖️ BMI Calculator</h1>

    <div class="creator">
        ✨ Created by Vineet Bharti ✨
    </div>

    <input id="weight" type="number" placeholder="Weight (kg)">

    <input id="height" type="number" placeholder="Height (cm)">

    <br>

    <button onclick="calculateBMI()">Calculate BMI</button>

    <div id="sticker"></div>

    <div id="result"></div>

    <div class="footer">
        💙 Stay Healthy & Stay Happy
    </div>

</div>

<script>

function calculateBMI() {

    let weight = Number(document.getElementById("weight").value);
    let height = Number(document.getElementById("height").value);

    if (weight <= 0 || height <= 0) {
        document.getElementById("sticker").innerHTML = "⚠️";
        document.getElementById("result").innerHTML =
            "Please enter valid weight and height.";
        return;
    }

    height = height / 100;

    let bmi = weight / (height * height);
    bmi = bmi.toFixed(1);

    let sticker = document.getElementById("sticker");
    let result = document.getElementById("result");

    if (bmi < 18.5) {
        sticker.innerHTML = "🥗";
        result.innerHTML =
            "BMI: " + bmi + "<br>Below the usual adult BMI range";
    }

    else if (bmi < 25) {
        sticker.innerHTML = "😊🎉";
        result.innerHTML =
            "BMI: " + bmi + "<br>In the usual adult BMI range!";
    }

    else if (bmi < 30) {
        sticker.innerHTML = "⚠️";
        result.innerHTML =
            "BMI: " + bmi + "<br>Above the usual adult BMI range";
    }

    else {
        sticker.innerHTML = "💪⚠️";
        result.innerHTML =
            "BMI: " + bmi + "<br>High BMI range";
    }
}

</script>

</body>
</html>
